<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS // TACTICAL SURVIVAL ARENA - ADVANCED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030307; color: #e2e8f0; overflow: hidden; font-family: monospace; touch-action: none; }
        canvas { background: #07070c; box-shadow: 0 0 40px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen w-screen select-none p-1 md:p-2">

    <!-- HUD Overlay -->
    <div id="hud" class="w-full max-w-[850px] flex justify-between items-center px-4 py-2 bg-zinc-900/95 border border-zinc-800/80 rounded-xl text-[10px] md:text-xs tracking-wider shadow-lg">
        <div class="flex items-center space-x-3 md:space-x-6">
            <div>HP: <span id="hpVal" class="text-emerald-400 font-bold">200</span>/200</div>
            <div>WEAPON: <span id="weaponVal" class="text-amber-400 font-bold">Assault Rifle</span></div>
        </div>
        <div class="text-center font-mono text-emerald-500 font-bold text-xs tracking-widest">
            ZONE <span id="levelVal">1</span>
        </div>
        <div class="flex items-center space-x-3 md:space-x-6">
            <div>HOSTILES: <span id="enemyVal" class="text-red-400 font-bold">0</span></div>
            <div>SCORE: <span id="scoreVal" class="text-zinc-200 font-bold">0</span></div>
        </div>
    </div>

    <!-- Game Canvas Container -->
    <div class="relative flex-grow flex items-center justify-center w-full overflow-hidden">
        <canvas id="gameCanvas" width="850" height="460" class="rounded-xl border border-zinc-800 max-w-full max-h-[62vh]"></canvas>
        
        <!-- Mission Overlay Screen -->
        <div id="overlay" class="absolute inset-0 bg-zinc-950/95 flex flex-col items-center justify-center space-y-4 p-4 rounded-xl backdrop-blur-md">
            <h1 id="overlayTitle" class="text-lg md:text-2xl font-bold tracking-widest text-emerald-400 text-center">TACTICAL SURVIVAL ARENA</h1>
            <p id="overlayDesc" class="text-[11px] md:text-xs text-zinc-400 text-center max-w-md">Engage hostile tactical units. Scavenge advanced weapons, deploy medikits dynamically, and survive escalating combat tiers.</p>
            <button id="actionBtn" onclick="startGame()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-zinc-950 font-bold text-xs tracking-widest rounded-lg transition-all shadow-lg shadow-emerald-950/50">
                INITIATE COMBAT
            </button>
        </div>
    </div>

    <!-- Mobile Touch Controls Bar -->
    <div class="w-full max-w-[850px] flex justify-between items-center px-4 py-2.5 bg-zinc-900/95 border border-zinc-800/80 rounded-xl mb-1 shadow-lg">
        <!-- Virtual D-Pad -->
        <div class="grid grid-cols-3 gap-1 w-36 h-24">
            <div></div>
            <button id="btnUp" class="bg-zinc-800/90 active:bg-emerald-600 rounded-lg text-zinc-300 font-bold flex items-center justify-center text-sm shadow">▲</button>
            <div></div>
            <button id="btnLeft" class="bg-zinc-800/90 active:bg-emerald-600 rounded-lg text-zinc-300 font-bold flex items-center justify-center text-sm shadow">◀</button>
            <button id="btnDown" class="bg-zinc-800/90 active:bg-emerald-600 rounded-lg text-zinc-300 font-bold flex items-center justify-center text-sm shadow">▼</button>
            <button id="btnRight" class="bg-zinc-800/90 active:bg-emerald-600 rounded-lg text-zinc-300 font-bold flex items-center justify-center text-sm shadow">▶</button>
        </div>
        <!-- Action Control Buttons -->
        <div class="flex space-x-3">
            <button id="btnMed" onclick="useMedikit()" class="px-4 py-3 bg-emerald-700/90 active:bg-emerald-500 text-white font-bold text-[10px] md:text-xs rounded-xl shadow-lg border border-emerald-500/30">
                MEDIKIT (<span id="medCount">2</span>)
            </button>
            <button id="btnShoot" class="px-7 py-3 bg-red-600 active:bg-red-500 text-white font-bold text-xs tracking-wider rounded-xl shadow-lg border border-red-500/30">
                FIRE
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "START";
        let score = 0;
        let level = 1;
        let medikitsHeld = 2;
        let screenShake = 0;

        let player = {
            x: 425,
            y: 230,
            radius: 12,
            speed: 3.4,
            hp: 200,
            maxHp: 200,
            angle: 0,
            weapon: "Tactical Rifle",
            fireRate: 200,
            lastShot: 0,
            damage: 35
        };

        let bullets = [];
        let enemies = [];
        let items = [];
        let particles = [];
        let muzzleFlashes = [];

        let moveUp = false, moveDown = false, moveLeft = false, moveRight = false, isFiring = false;

        const bindTouch = (id, startCb, endCb) => {
            const el = document.getElementById(id);
            el.addEventListener("touchstart", (e) => { e.preventDefault(); startCb(); });
            el.addEventListener("touchend", (e) => { e.preventDefault(); endCb(); });
            el.addEventListener("mousedown", (e) => { e.preventDefault(); startCb(); });
            el.addEventListener("mouseup", (e) => { e.preventDefault(); endCb(); });
        };

        bindTouch("btnUp", () => moveUp = true, () => moveUp = false);
        bindTouch("btnDown", () => moveDown = true, () => moveDown = false);
        bindTouch("btnLeft", () => moveLeft = true, () => moveLeft = false);
        bindTouch("btnRight", () => moveRight = true, () => moveRight = false);
        bindTouch("btnShoot", () => isFiring = true, () => isFiring = false);

        function startGame() {
            score = 0;
            level = 1;
            player.hp = 200;
            player.weapon = "Tactical Rifle";
            player.damage = 35;
            player.fireRate = 200;
            medikitsHeld = 2;
            document.getElementById("overlay").classList.add("hidden");
            gameState = "PLAYING";
            initLevel();
        }

        function initLevel() {
            enemies = [];
            items = [];
            bullets = [];
            
            let enemyCount = 4 + level * 2;
            for (let i = 0; i < enemyCount; i++) {
                let ex, ey;
                do {
                    ex = Math.random() * (canvas.width - 80) + 40;
                    ey = Math.random() * (canvas.height - 80) + 40;
                } while (Math.hypot(ex - player.x, ey - player.y) < 140);

                enemies.push({
                    x: ex,
                    y: ey,
                    radius: 14,
                    speed: 1.3 + level * 0.18,
                    hp: 45 + level * 15,
                    maxHp: 45 + level * 15,
                    damage: 10 + level * 2.5,
                    color: level > 2 ? '#ef4444' : '#f97316'
                });
            }

            // Spawn Medikits
            for (let i = 0; i < 2; i++) {
                items.push({
                    x: Math.random() * 750 + 50,
                    y: Math.random() * 380 + 40,
                    type: 'medikit',
                    radius: 10
                });
            }

            updateHUD();
        }

        function useMedikit() {
            if (medikitsHeld > 0 && player.hp < player.maxHp) {
                player.hp = Math.min(player.maxHp, player.hp + 75);
                medikitsHeld--;
                spawnParticles(player.x, player.y, '#10b981', 12);
                updateHUD();
            }
        }

        function updateHUD() {
            document.getElementById("hpVal").innerText = Math.max(0, Math.floor(player.hp));
            document.getElementById("weaponVal").innerText = player.weapon;
            document.getElementById("levelVal").innerText = level;
            document.getElementById("enemyVal").innerText = enemies.length;
            document.getElementById("scoreVal").innerText = score;
            document.getElementById("medCount").innerText = medikitsHeld;
        }

        function spawnParticles(x, y, color, count = 6) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    alpha: 1, color: color,
                    decay: Math.random() * 0.04 + 0.02
                });
            }
        }

        function shoot() {
            let now = Date.now();
            if (now - player.lastShot < player.fireRate) return;
            player.lastShot = now;
            screenShake = 4; // Add realistic recoil screen shake

            let angle = player.angle;
            bullets.push({
                x: player.x + Math.cos(angle) * 15,
                y: player.y + Math.sin(angle) * 15,
                vx: Math.cos(angle) * 12,
                vy: Math.sin(angle) * 12,
                damage: player.damage,
                range: 550
            });

            // Muzzle flash effect
            muzzleFlashes.push({
                x: player.x + Math.cos(angle) * 22,
                y: player.y + Math.sin(angle) * 22,
                life: 3
            });
        }

        function update() {
            if (gameState !== "PLAYING") return;

            if (screenShake > 0) screenShake--;

            let dx = 0, dy = 0;
            if (moveUp) dy -= 1;
            if (moveDown) dy += 1;
            if (moveLeft) dx -= 1;
            if (moveRight) dx += 1;

            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + dx * player.speed));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + dy * player.speed));

            // Realistic Auto-Target Nearest Enemy
            if (enemies.length > 0) {
                let closest = enemies[0];
                let minDist = Math.hypot(closest.x - player.x, closest.y - player.y);
                for (let e of enemies) {
                    let dist = Math.hypot(e.x - player.x, e.y - player.y);
                    if (dist < minDist) { minDist = dist; closest = e; }
                }
                player.angle = Math.atan2(closest.y - player.y, closest.x - player.x);
            }

            if (isFiring) shoot();

            // Bullets update
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.range -= Math.hypot(b.vx, b.vy);
                if (b.range <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1); continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius) {
                        e.hp -= b.damage;
                        spawnParticles(b.x, b.y, '#facc15', 3);
                        bullets.splice(i, 1);
                        if (e.hp <= 0) {
                            spawnParticles(e.x, e.y, '#ef4444', 12);
                            score += 150 * level;
                            enemies.splice(j, 1);
                            if (Math.random() < 0.4) {
                                medikitsHeld++; // Scavenge medikit from fallen enemy
                            }
                        }
                        break;
                    }
                }
            }

            // Enemies AI Movement
            for (let e of enemies) {
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    player.hp -= e.damage * 0.05;
                    screenShake = 6;
                    if (player.hp <= 0) gameOver();
                }
            }

            // Items collection
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                if (Math.hypot(player.x - item.x, player.y - item.y) < player.radius + item.radius) {
                    if (item.type === 'medikit') {
                        medikitsHeld++;
                        spawnParticles(player.x, player.y, '#10b981', 8);
                    }
                    items.splice(i, 1);
                }
            }

            if (enemies.length === 0) {
                level++;
                gameState = "LEVEL_TRANSITION";
                document.getElementById("overlayTitle").innerText = `ZONE ${level - 1} SECURED`;
                document.getElementById("overlayDesc").innerText = `Hostiles neutralized. Tactical tier ${level} incoming.`;
                document.getElementById("actionBtn").innerText = `ADVANCE TO ZONE ${level}`;
                document.getElementById("overlay").classList.remove("hidden");
            }

            updateHUD();
        }

        function draw() {
            ctx.save();
            // Apply Realistic Screen Shake Transform
            if (screenShake > 0) {
                let sx = (Math.random() - 0.5) * screenShake * 2;
                let sy = (Math.random() - 0.5) * screenShake * 2;
                ctx.translate(sx, sy);
            }

            ctx.fillStyle = "#07070c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tactical Grid Background
            ctx.strokeStyle = "#11111c";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 45) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 45) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            // Items Glow
            for (let item of items) {
                ctx.save();
                ctx.translate(item.x, item.y);
                ctx.shadowColor = "#10b981";
                ctx.shadowBlur = 10;
                ctx.fillStyle = "#10b981"; ctx.fillRect(-7, -7, 14, 14);
                ctx.fillStyle = "#ffffff"; ctx.fillRect(-2, -5, 4, 10); ctx.fillRect(-5, -2, 10, 4);
                ctx.restore();
            }

            // Bullets Glow
            ctx.shadowColor = "#facc15";
            ctx.shadowBlur = 8;
            ctx.fillStyle = "#facc15";
            for (let b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2); ctx.fill(); }
            ctx.shadowBlur = 0;

            // Enemies Rendering
            for (let e of enemies) {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2); ctx.fill();
                
                // Enemy Health bar
                ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(-14, -22, 28, 4);
                ctx.fillStyle = "#ef4444"; ctx.fillRect(-14, -22, (e.hp / e.maxHp) * 28, 4);
                ctx.restore();
            }

            // Player Rendering
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            // Gun Barrel
            ctx.fillStyle = "#52525b"; ctx.fillRect(2, -3, 18, 5);
            // Player Body Glow
            ctx.shadowColor = "#10b981";
            ctx.shadowBlur = 12;
            ctx.fillStyle = "#10b981"; ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#047857"; ctx.lineWidth = 2.5; ctx.stroke();
            ctx.restore();

            // Muzzle Flash
            for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
                let mf = muzzleFlashes[i];
                ctx.fillStyle = "#fef08a";
                ctx.beginPath(); ctx.arc(mf.x, mf.y, 8, 0, Math.PI * 2); ctx.fill();
                mf.life--;
                if (mf.life <= 0) muzzleFlashes.splice(i, 1);
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                if (p.alpha <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();
        }

        function gameOver() {
            gameState = "GAMEOVER";
            document.getElementById("overlayTitle").innerText = "MISSION FAILED";
            document.getElementById("overlayDesc").innerText = `Final Score: ${score} | Reached Zone: ${level}`;
            document.getElementById("actionBtn").innerText = "RE-ENGAGE MISSION";
            document.getElementById("overlay").classList.remove("hidden");
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
